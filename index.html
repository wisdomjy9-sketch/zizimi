<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>인공지능 지지미 (지구지키미)</title>
<style>
  /* 글꼴: 학교 안심폰트 '온글잎 의청수 시우체' (OFL, 누구나 자유롭게 사용·배포 가능)
     fonts 폴더를 index.html과 같은 곳에 함께 두어야 함.
     이 글꼴은 글자가 작게 그려져 있어서 size-adjust로 1.3배 키워 씀 */
  @font-face { font-family: "SiWoo"; src: url("fonts/Ownglyph_2022_UWY_Si_Woo-Rg.ttf") format("truetype"); font-display: swap; size-adjust: 130%; }

  :root {
    --green: #2e7d32;
    --radius: 16px;
    --shadow: 0 2px 10px rgba(46, 125, 50, .12);
  }
  * { box-sizing: border-box; }
  body { font-family: "SiWoo", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; max-width: 560px; margin: 0 auto; padding: 20px 16px 40px; background: #f4faf4; color: #222; }

  /* 머리말: 지지미 + 제목 */
  header { display: flex; align-items: center; gap: 12px; }
  header svg { width: 60px; height: 66px; flex: none; }
  /* 제목: '인공지능'·'구'·'키'는 초록, '지·지·미'는 파랑(지지미 지구 색) */
  h1 { font-size: 26px; font-weight: normal; margin: 0; color: var(--green); line-height: 1.2; -webkit-text-stroke: .6px var(--green); }
  h1 .big { font-size: 1.6em; }
  h1 .paren { font-size: .8em; white-space: nowrap; }
  h1 .jjm { color: #0288d1; -webkit-text-stroke: 1px #0288d1; }
  .sub { font-size: 17px; margin: 4px 0 0; line-height: 1.45; }
  .scope { display: inline-block; font-size: 15px; color: #6d5a1f; background: #fff8e1; border-radius: 999px; padding: 6px 14px; margin: 12px 0 14px; }

  /* 사진 자리: 고르기 전에는 점선 틀 + 가운데 안내 */
  #frame { position: relative; aspect-ratio: 4 / 3; background: #fff; border: 3px dashed #a5d6a7; border-radius: var(--radius); display: flex; align-items: center; justify-content: center; overflow: hidden; margin-bottom: 14px; }
  #frame .target { width: 58%; height: 66%; border: 3px solid #c8e6c9; border-radius: 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #6f9f73; font-size: 17px; line-height: 1.5; text-align: center; padding: 8px; }
  #frame .target b { font-size: 34px; line-height: 1; color: #a5d6a7; margin-bottom: 6px; }
  #preview { display: none; width: 100%; height: 100%; object-fit: contain; }
  #frame.has-photo { border-style: solid; border-color: #c8e6c9; box-shadow: var(--shadow); }
  #frame.has-photo .target { display: none; }
  #frame.has-photo #preview { display: block; }

  /* 버튼 */
  .btns { display: flex; gap: 10px; flex-wrap: wrap; }
  label, input, button { font-family: inherit; }
  .btn { font-weight: 500; flex: 1; display: block; text-align: center; font-size: 20px; padding: 16px 10px; border-radius: var(--radius); background: var(--green); color: #fff; cursor: pointer; min-width: 140px; box-shadow: var(--shadow); }
  .btn.two { background: #fff; color: var(--green); border: 2px solid var(--green); }
  .btn.off { background: #bdbdbd; border-color: #bdbdbd; color: #fff; box-shadow: none; pointer-events: none; }

  /* 지지미 말풍선 */
  .talk { display: flex; align-items: flex-start; gap: 8px; margin-top: 20px; }
  #mascot { width: 76px; flex: none; position: relative; }
  #mascot svg { width: 76px; height: 92px; display: block; }
  .bubble { --tone: #c8e6c9; --ink: #555; position: relative; flex: 1; background: #fff; border: 3px solid var(--tone); border-radius: var(--radius); padding: 12px 14px; box-shadow: var(--shadow); }
  .bubble::before { content: ""; position: absolute; left: -21px; top: 22px; border: 9px solid transparent; border-right: 12px solid var(--tone); }
  #icon { display: none; font-size: 44px; line-height: 1; margin-bottom: 6px; }
  #result { font-size: 18px; line-height: 1.5; color: var(--ink); }
  #bars, #guide, #again { display: none; }

  .bubble.done #icon, .bubble.done #bars { display: block; }
  .bubble.done #guide { display: block; }
  .bubble.done #again { display: block; }
  .bubble.done #result { font-size: 25px; font-weight: bold; margin-bottom: 4px; }
  .bubble.r-plastic { --tone: #fb8c00; --ink: #e65100; background: #fff8f0; }
  .bubble.r-bag     { --tone: #43a047; --ink: #2e7d32; background: #f3fbf3; }
  .bubble.r-unsure  { --tone: #90a4ae; --ink: #455a64; background: #f5f8fa; }
  .bubble.r-unsure #bars { display: none; }

  .bar-row { margin: 8px 0; font-size: 17px; }
  .bar-row.dim { opacity: .4; }
  .bar { height: 20px; background: #e0e0e0; border-radius: 6px; overflow: hidden; margin-top: 3px; }
  .fill { height: 100%; }
  .fill.plastic { background: #fb8c00; }
  .fill.bag { background: #43a047; }
  #guide { font-size: 19px; line-height: 1.6; background: rgba(255, 255, 255, .85); border-radius: 12px; padding: 10px 14px; margin-top: 12px; }
  #guide ul { margin: 4px 0 0; padding-left: 22px; }
  #again { margin-top: 12px; font-size: 19px; padding: 13px 10px; }

  .note { font-size: 14px; color: #666; margin-top: 22px; line-height: 1.6; }

  /* 지지미 움직임: 기다릴 때 둥실, 살펴볼 때 갸웃 + 돋보기 */
  #lens { display: none; }
  #mascot.think #lens { display: inline; }
  #mascot.idle svg { animation: bob 2.4s ease-in-out infinite; }
  #mascot.think svg { animation: think .9s ease-in-out infinite; transform-origin: 50% 85%; }
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
  @keyframes think { 0%, 100% { transform: rotate(-8deg); } 50% { transform: rotate(8deg); } }
  @media (prefers-reduced-motion: reduce) { #mascot svg { animation: none !important; } }
</style>
</head>
<body>
  <!-- 지지미 그림 (한 번 그려 두고 두 곳에서 씀) -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="jijimi" viewBox="0 0 100 110">
      <path d="M50 26 V10" stroke="#558b2f" stroke-width="4" stroke-linecap="round"/>
      <ellipse cx="40" cy="12" rx="10" ry="5" fill="#7cb342" transform="rotate(-25 40 12)"/>
      <ellipse cx="60" cy="9" rx="10" ry="5" fill="#9ccc65" transform="rotate(25 60 9)"/>
      <circle cx="50" cy="64" r="38" fill="#4fc3f7"/>
      <path d="M22 50 q8 -14 22 -10 q6 8 -4 14 q-10 2 -8 12 q-8 2 -10 -16z" fill="#66bb6a"/>
      <path d="M62 34 q14 2 20 14 q-6 6 -14 2 q-8 -6 -6 -16z" fill="#66bb6a"/>
      <path d="M58 88 q10 -8 20 -4 q-4 10 -16 12 q-6 -2 -4 -8z" fill="#66bb6a"/>
      <circle cx="38" cy="62" r="5.5" fill="#263238"/>
      <circle cx="62" cy="62" r="5.5" fill="#263238"/>
      <circle cx="40" cy="60" r="1.8" fill="#fff"/>
      <circle cx="64" cy="60" r="1.8" fill="#fff"/>
      <circle cx="29" cy="72" r="5" fill="#f48fb1" opacity=".6"/>
      <circle cx="71" cy="72" r="5" fill="#f48fb1" opacity=".6"/>
      <path d="M42 74 Q50 82 58 74" stroke="#263238" stroke-width="3" fill="none" stroke-linecap="round"/>
    </symbol>
  </svg>

  <header>
    <svg aria-hidden="true"><use href="#jijimi"/></svg>
    <div>
      <h1>인공지능 <span class="jjm big">지지미</span> <span class="paren">(<span class="jjm">지</span>구<span class="jjm">지</span>키<span class="jjm">미</span>)</span></h1>
      <p class="sub">사진 속 물건이 <b>일회용 비닐봉지</b>인지<br><b>다회용 장바구니</b>인지 알려 줘요.</p>
    </div>
  </header>
  <div class="scope">📷 물건 <b>하나만</b> 가운데에 크게 · 비닐봉지와 장바구니만 구분해요</div>

  <div id="frame">
    <div class="target"><b>＋</b>물건을 이 안에<br>크게 찍어 주세요</div>
    <img id="preview" alt="고른 사진">
  </div>

  <div class="btns">
    <!-- 휴대폰·태블릿에서는 카메라가 바로 열림. 컴퓨터에서는 사진 고르기와 같음 -->
    <label class="btn off" id="camBtn">📸 사진 찍기
      <input type="file" id="cam" accept="image/*" capture="environment" style="display:none">
    </label>
    <label class="btn two off" id="fileBtn">🖼️ 사진 고르기
      <input type="file" id="file" accept="image/*" style="display:none">
    </label>
  </div>

  <div class="talk">
    <div id="mascot" class="think" aria-hidden="true">
      <svg viewBox="0 0 100 120">
        <use href="#jijimi"/>
        <g id="lens">
          <line x1="86" y1="104" x2="96" y2="116" stroke="#455a64" stroke-width="5" stroke-linecap="round"/>
          <circle cx="80" cy="96" r="11" fill="rgba(255,255,255,.6)" stroke="#455a64" stroke-width="4"/>
        </g>
      </svg>
    </div>
    <div id="bubble" class="bubble" aria-live="polite">
      <div id="icon"></div>
      <div id="result">AI를 준비하는 중이에요...</div>
      <div id="bars"></div>
      <div id="guide"></div>
      <label for="cam" id="again" class="btn">📸 다시 찍기</label>
    </div>
  </div>

  <p class="note">AI는 틀릴 수 있어요. 확률이 높아도 꼭 정답이라는 뜻은 아니에요.<br>
  사진은 이 기기 안에서만 쓰이고, 저장하거나 밖으로 보내지 않아요.</p>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8/dist/teachablemachine-image.min.js"></script>
<script>
  // 모델 주소: 티처블 머신에서 '업로드'로 받은 링크 (끝에 / 를 꼭 붙임)
  const MODEL_URL = "https://teachablemachine.withgoogle.com/models/A0pDRXYJl/"; // v1 모델 (학습용 비닐 72장, 장바구니 65장)

  // '잘 모르겠어요' 기준값. 가장 높은 확률이 이 값보다 낮으면 답하지 않음
  // (교사용 평가 화면의 기준값별 표를 보고 정한 값으로 바꿈)
  const THRESHOLD = 0.9; // v1, 개발용 26장의 기준값별 표에서 목표(답한 것의 정확도 90% 이상)를 넘는 가장 낮은 값

  // 모델의 클래스 이름이 v0, v1마다 조금 달라서('비닐봉지', '일회용 비닐봉지' 등)
  // 이름에 '비닐'이 들어 있으면 비닐봉지, 아니면 장바구니로 봄
  const kind = name => name.includes("비닐") ? "plastic" : "bag";
  // 학생 화면에 보여 줄 이름
  const SHOW = { plastic: "일회용 비닐봉지", bag: "다회용 장바구니" };
  // 결과마다 보여 줄 큰 그림
  const ICONS = { plastic: "🛍️❗", bag: "♻️👍" };
  // 결과마다 학생에게 보여 줄 실천 안내 문구
  const MESSAGES = {
    plastic: "다음 장보기에는 집에 있는 장바구니를 챙겨 볼까요? 🛍️",
    bag: "가지고 있는 장바구니를 여러 번 사용해 보세요. 👍"
  };

  const $ = id => document.getElementById(id);
  const bubble = $("bubble"), mascot = $("mascot");
  let model;

  // 지지미가 말하기: 말풍선 문구와 지지미 움직임(idle: 둥실, think: 갸웃)을 바꿈
  function say(text, mood) {
    bubble.className = "bubble";
    $("result").textContent = text;
    mascot.className = mood;
  }
  // 버튼 켜기/끄기 (살펴보는 동안에는 끔)
  function setButtons(on) {
    ["camBtn", "fileBtn", "again"].forEach(id => $(id).classList.toggle("off", !on));
  }

  // 1) 모델을 불러오고, 다 불러오면 버튼을 켬
  async function loadModel() {
    try {
      model = await tmImage.load(MODEL_URL + "model.json", MODEL_URL + "metadata.json");
      say("준비됐어요! 사진을 찍거나 골라 주세요.", "idle");
      setButtons(true);
    } catch (e) {
      say("AI를 불러오지 못했어요. 인터넷이 연결됐는지 확인하고 새로고침해 주세요.", "idle");
    }
  }

  // 2) 사진을 예측하고, 가장 높은 확률을 기준값과 견주어 결과 말풍선을 꾸밈
  async function predict(img) {
    const preds = await model.predict(img);
    preds.sort((a, b) => b.probability - a.probability);
    const top = preds[0];

    // 클래스별 확률 막대 (높은 것부터, 가장 높은 것만 진하게)
    $("bars").innerHTML = preds.map((p, i) => {
      const k = kind(p.className);
      return `<div class="bar-row${i ? " dim" : ""}">${SHOW[k]} ${(p.probability * 100).toFixed(0)}%
        <div class="bar"><div class="fill ${k}" style="width:${(p.probability * 100).toFixed(1)}%"></div></div></div>`;
    }).join("");

    mascot.className = "idle";
    if (top.probability < THRESHOLD) {
      // 확신이 낮을 때: 멈추지 않고 다음에 할 일을 알려 줌 ('실패', '오류'라는 말은 쓰지 않음)
      bubble.className = "bubble done r-unsure";
      $("icon").textContent = "🤔";
      $("result").textContent = "음… 잘 모르겠어요";
      // 서로 써 보기에서 '잘 모르겠어요'를 앱이 못하는 것으로 받아들여서, 왜 이렇게 답하는지 먼저 알려 줌
      $("guide").innerHTML = "AI가 확실하지 않을 때는 틀린 답을 말하는 대신 다시 찍어 달라고 해요.<br>이렇게 다시 찍어 볼까요?<ul>" +
        "<li>물건을 화면 가운데에 크게 놓아요</li>" +
        "<li>밝은 곳에서 찍어요</li>" +
        "<li>한 번에 하나만 보여 줘요</li></ul>" +
        "두 번 해도 같으면 선생님께 보여 주세요.";
    } else {
      const k = kind(top.className);
      bubble.className = "bubble done r-" + k;
      $("icon").textContent = ICONS[k];
      $("result").textContent = SHOW[k] + " 같아요!";
      $("guide").textContent = MESSAGES[k];
    }
  }

  // 3) 사진을 찍거나 고르면 틀 안에 보여 주고 예측함 (사진은 저장하거나 보내지 않음)
  function onPick(e) {
    const f = e.target.files[0];
    if (!f || !model) return;
    const img = $("preview");
    const url = URL.createObjectURL(f);
    $("frame").classList.add("has-photo");
    say("음… 살펴보는 중이에요 🔍", "think");
    setButtons(false);
    img.onload = async () => {
      try {
        await predict(img);
      } catch (err) {
        say("앗, 사진을 다시 한 번 골라 주세요.", "idle");
      }
      URL.revokeObjectURL(url);
      setButtons(true);
    };
    img.src = url;
    e.target.value = ""; // 같은 사진을 다시 골라도 예측되게 비움
  }
  $("cam").addEventListener("change", onPick);
  $("file").addEventListener("change", onPick);

  loadModel();
</script>
</body>
</html>
