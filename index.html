<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>인공지능 지지미 (지구지키미)</title>
<style>
  body { font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; max-width: 560px; margin: 0 auto; padding: 20px; background: #f4faf4; color: #222; }
  h1 { font-size: 28px; margin: 0 0 4px; color: #2e7d32; }
  .sub { font-size: 18px; margin: 0 0 16px; line-height: 1.5; }
  .scope { background: #fff8e1; border: 2px solid #ffcc80; border-radius: 12px; padding: 12px 14px; font-size: 17px; line-height: 1.6; margin-bottom: 16px; }
  .btns { display: flex; gap: 10px; flex-wrap: wrap; }
  .btn { flex: 1; text-align: center; font-size: 20px; padding: 16px 10px; border-radius: 14px; background: #2e7d32; color: #fff; cursor: pointer; min-width: 140px; }
  .btn.two { background: #fff; color: #2e7d32; border: 2px solid #2e7d32; }
  .btn.off { background: #bdbdbd; border-color: #bdbdbd; color: #fff; pointer-events: none; }
  #status { font-size: 15px; color: #555; margin: 10px 0 0; }
  #preview { display: none; max-width: 100%; max-height: 300px; margin: 16px auto 8px; border-radius: 12px; }
  #card { display: none; background: #fff; border: 2px solid #c8e6c9; border-radius: 14px; padding: 14px 16px; margin-top: 8px; }
  #result { font-size: 26px; font-weight: bold; margin: 0 0 10px; }
  #guide { font-size: 19px; line-height: 1.6; background: #e8f5e9; border-radius: 10px; padding: 10px 14px; margin-top: 12px; }
  #guide ul { margin: 4px 0 0; padding-left: 22px; }
  .bar-row { margin: 8px 0; font-size: 17px; }
  .bar { height: 20px; background: #e0e0e0; border-radius: 6px; overflow: hidden; margin-top: 3px; }
  .fill { height: 100%; background: #66bb6a; }
  .note { font-size: 14px; color: #666; margin-top: 18px; line-height: 1.6; }
</style>
</head>
<body>
  <h1>🌏 인공지능 지지미</h1>
  <p class="sub">사진 속 물건이 <b>일회용 비닐봉지</b>인지<br><b>다회용 천 장바구니</b>인지 알려 줘요.</p>
  <div class="scope">📷 물건 <b>하나만</b> 화면 가운데에 크게 찍어 주세요.<br>비닐봉지와 천 장바구니만 구분할 수 있어요.</div>

  <div class="btns">
    <!-- 휴대폰·태블릿에서는 카메라가 바로 열림. 컴퓨터에서는 사진 고르기와 같음 -->
    <label class="btn off" id="camBtn">📸 사진 찍기
      <input type="file" id="cam" accept="image/*" capture="environment" style="display:none">
    </label>
    <label class="btn two off" id="fileBtn">🖼️ 사진 고르기
      <input type="file" id="file" accept="image/*" style="display:none">
    </label>
  </div>
  <p id="status">AI를 준비하는 중이에요...</p>

  <img id="preview" alt="고른 사진">
  <div id="card">
    <div id="result"></div>
    <div id="bars"></div>
    <div id="guide"></div>
  </div>

  <p class="note">AI는 틀릴 수 있어요. 확률이 높아도 꼭 정답이라는 뜻은 아니에요.<br>
  사진은 이 기기 안에서만 쓰이고, 저장하거나 밖으로 보내지 않아요.</p>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8/dist/teachablemachine-image.min.js"></script>
<script>
  // 모델 주소: 티처블 머신에서 '업로드'로 받은 링크 (끝에 / 를 꼭 붙임)
  const MODEL_URL = "https://teachablemachine.withgoogle.com/models/A0pDRXYJl/"; // v1 모델 (학습용 비닐 72장, 장바구니 65장)

  // '잘 모르겠어요' 기준값. 가장 높은 확률이 이 값보다 낮으면 답하지 않음
  // (교사용 평가 화면의 기준값별 표를 보고 정한 값으로 바꿈)
  const THRESHOLD = 0.9; // v1, 개발용 26장의 기준값별 표에서 목표(답한 것의 정확도 90% 이상)를 넘는 가장 낮은 값

  // 모델의 클래스 이름이 v0, v1마다 조금 달라서('비닐봉지', '일회용 비닐봉지' 등)
  // 이름에 '비닐'이 들어 있으면 비닐봉지, 아니면 장바구니로 봄
  const kind = name => name.includes("비닐") ? "plastic" : "bag";
  // 학생 화면에 보여 줄 이름
  const SHOW = { plastic: "일회용 비닐봉지", bag: "다회용 천 장바구니" };
  // 결과마다 학생에게 보여 줄 실천 안내 문구
  const MESSAGES = {
    plastic: "다음 장보기에는 집에 있는 장바구니를 챙겨 볼까요? 🛍️",
    bag: "가지고 있는 장바구니를 여러 번 사용해 보세요. 👍"
  };

  let model;

  // 1) 모델을 불러오고, 다 불러오면 버튼을 켬
  async function loadModel() {
    try {
      model = await tmImage.load(MODEL_URL + "model.json", MODEL_URL + "metadata.json");
      document.getElementById("status").textContent = "준비됐어요! 사진을 찍거나 골라 주세요.";
      document.getElementById("camBtn").classList.remove("off");
      document.getElementById("fileBtn").classList.remove("off");
    } catch (e) {
      document.getElementById("status").textContent = "AI를 불러오지 못했어요. 인터넷이 연결됐는지 확인하고 새로고침해 주세요.";
    }
  }

  // 2) 사진을 예측하고, 가장 높은 확률을 기준값과 견주어 결과 문구를 정함
  async function predict(img) {
    const preds = await model.predict(img);
    preds.sort((a, b) => b.probability - a.probability);
    const top = preds[0];

    // 클래스별 확률 막대 (높은 것부터)
    document.getElementById("bars").innerHTML = preds.map(p =>
      `<div class="bar-row">${SHOW[kind(p.className)]} ${(p.probability * 100).toFixed(0)}%
        <div class="bar"><div class="fill" style="width:${(p.probability * 100).toFixed(1)}%"></div></div></div>`
    ).join("");

    const result = document.getElementById("result");
    const guide = document.getElementById("guide");
    if (top.probability < THRESHOLD) {
      // 확신이 낮을 때: 멈추지 않고 다음에 할 일을 알려 줌 ('실패', '오류'라는 말은 쓰지 않음)
      result.textContent = "🤔 잘 모르겠어요";
      guide.innerHTML = "이렇게 다시 찍어 볼까요?<ul>" +
        "<li>물건을 화면 가운데에 크게 놓아요</li>" +
        "<li>밝은 곳에서 찍어요</li>" +
        "<li>한 번에 하나만 보여 줘요</li></ul>" +
        "두 번 해도 같으면 선생님께 보여 주세요.";
    } else {
      result.textContent = SHOW[kind(top.className)] + " 같아요";
      guide.textContent = MESSAGES[kind(top.className)];
    }
    document.getElementById("card").style.display = "block";
  }

  // 3) 사진을 찍거나 고르면 화면에 보여 주고 예측함 (사진은 저장하거나 보내지 않음)
  function onPick(e) {
    const f = e.target.files[0];
    if (!f || !model) return;
    const img = document.getElementById("preview");
    img.onload = () => predict(img);
    img.src = URL.createObjectURL(f);
    img.style.display = "block";
    e.target.value = ""; // 같은 사진을 다시 골라도 예측되게 비움
  }
  document.getElementById("cam").addEventListener("change", onPick);
  document.getElementById("file").addEventListener("change", onPick);

  loadModel();
</script>
</body>
</html>
